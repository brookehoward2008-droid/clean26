name: Import Assessment 6 InDesign artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-assessment6-indesign.yml'

permissions:
  contents: write

jobs:
  import-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean26
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Adobe artifacts
        env:
          PDF_URL: 'https://at.adobe.com/xawbLCieSlzT4SiPsQq7aQlg1UyA'
          INDD_URL: 'https://to.adobe.com/UWkb1'
        run: |
          set -euo pipefail
          mkdir -p pages/assessment-6-reflection-bh
          curl -L --fail --retry 3 --retry-delay 2 "$PDF_URL" -o pages/assessment-6-reflection-bh/assessment-6-reflection-bh.pdf
          curl -L --fail --retry 3 --retry-delay 2 "$INDD_URL" -o pages/assessment-6-reflection-bh/assessment-6-reflection-bh-indesign.zip
          test -s pages/assessment-6-reflection-bh/assessment-6-reflection-bh.pdf
          test -s pages/assessment-6-reflection-bh/assessment-6-reflection-bh-indesign.zip

      - name: Commit permanent copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/assessment-6-reflection-bh/assessment-6-reflection-bh.pdf pages/assessment-6-reflection-bh/assessment-6-reflection-bh-indesign.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Assessment 6 Adobe InDesign artifacts'
          git push
